<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bridge Builder — IndoPak.love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:system-ui,sans-serif}
#c{display:block;border-radius:12px;box-shadow:0 0 60px rgba(45,143,78,0.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=800,H=580;
C.width=W;C.height=H;
function size(){const r=W/H,m=Math.min(window.innerWidth*.97/W,window.innerHeight*.95/H);C.style.width=W*m+'px';C.style.height=H*m+'px';}
size();window.onresize=size;

// ── helpers ─────────────────────────────────────────────
const $=(a,b,t)=>{if(isNaN(t)||t==null)t=0;return a+(b-a)*t;};
const $c=(a,b,t)=>{if(isNaN(t)||t==null)t=0;t=Math.max(0,Math.min(1,t));const p=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];const[r,g,B2]=p(a),[br,bg,bb]=p(b);return`rgb(${Math.round(r+(br-r)*t)},${Math.round(g+(bg-g)*t)},${Math.round(B2+(bb-B2)*t)})`;};
const clamp=(v,mx)=>Math.max(mx,Math.min(1,v));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const star=(cx,cy,sp,or,ir)=>{X.beginPath();for(let i=0;i<sp*2;i++){const r=i%2===0?or:ir,a=(i*Math.PI)/sp-Math.PI/2;if(i===0)X.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));else X.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}X.closePath();X.fill();};
const rf=(min,max)=>Math.random()*(max-min)+min;

// ── audio ───────────────────────────────────────────────
let AC=null;
const initAC=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext);if(AC.state==='suspended')AC.resume();};
const tone=(f,type='sine',dur=.15,vol=.25,f2=null)=>{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+dur);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);};
const sfxM=()=>{tone(660,'sine',.08,.2);setTimeout(()=>tone(880,'sine',.1,.15),80);};
const sfxB=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.15,.2),i*90));};
const sfxH=()=>tone(80,'sawtooth',.3,.35);
const sfxS=()=>tone(440,'sine',.06,.15);
const sfxL=()=>{[262,330,392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.2,.25),i*120));};
const sfxMiss=()=>tone(150,'sawtooth',.2,.2);

// ── consts ──────────────────────────────────────────────
const GRID=6,TILE=64,PAD=8;
const GX=(W-GRID*TILE)/2,GY=90;
const TILES=[
  {color:'#2d8f4e',sym:'🇵🇰'},
  {color:'#FF8C00',sym:'🇮🇳'},
  {color:'#FF4B4B',sym:'❤️'},
  {color:'#FECA57',sym:'⭐'},
  {color:'#c8a2c8',sym:'☕'},
  {color:'#64b5f6',sym:'📖'},
];
const FACTS=['Chai unites us all ☕','Cricket bridges nations 🏏','Faiz Ahmed Faiz: loved across borders ✍️','Taj Mahal & Badshahi Mosque — both built with love 🕌','Qawwali echoes in both lands 🎵'];

// ── state ─────────────────────────────────────────────
let S='start',grid=[],sel=null,score=0,lives=3,lv=1;
let bridge=0,bNeed=0,mThis=0;
let hates=[],hateT=0,combo=0;
let parts=[];
let unity=0,fact='',factT=0,flash=0;
let fc=0,cd=15,lastTick=0;
let bgP=0,waterP=0;
let hiScore=parseInt(localStorage.getItem('bb_hs')||'0');
let gameOverR='';

// ── grid ────────────────────────────────────────────────
function initG(){
  grid=[];
  for(let r=0;r<GRID;r++){
    grid[r]=[];
    for(let c=0;c<GRID;c++){
      let id;
      do{id=ri(0,TILES.length-1);}while(
        (c>=2&&grid[r][c-1]===id&&grid[r][c-2]===id)||
        (r>=2&&grid[r-1][c]===id&&grid[r-2][c]===id)
      );
      grid[r][c]=id;
    }
  }
}
function refG(){
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    if(grid[r][c]===-1){
      let id;
      do{id=ri(0,TILES.length-1);}while(
        (c>=2&&grid[r][c-1]===id&&grid[r][c-2]===id)||
        (r>=2&&grid[r-1][c]===id&&grid[r-2][c]===id)
      );
      grid[r][c]=id;
    }
  }
}
function rmM(){
  let m=[];
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    if(hates.some(h=>h.c===c&&h.r===r))continue;
    const id=grid[r][c];
    let len=1;while(c+len<GRID&&!hates.some(h=>h.c===c+len&&h.r===r)&&grid[r][c+len]===id)len++;
    if(len>=3)for(let i=0;i<len;i++)m.push({c:c+i,r,id});
    len=1;while(r+len<GRID&&!hates.some(h=>h.c===c&&h.r===r+len)&&grid[r+len][c]===id)len++;
    if(len>=3)for(let i=0;i<len;i++)if(!m.some(v=>v.c===c&&v.r===r+i))m.push({c,r:r+i,id});
  }
  let u=[],seen={};
  m.forEach(v=>{const k=`${v.c},${v.r}`;if(!seen[k]){seen[k]=1;u.push(v);}});
  return u;
}
function grav(){
  for(let c=0;c<GRID;c++){
    let col=[];
    for(let r=GRID-1;r>=0;r--){if(!hates.some(h=>h.c===c&&h.r===r)&&grid[r][c]!==-1)col.push(grid[r][c]);}
    const gap=GRID-col.length;
    for(let r=GRID-1;r>=0;r--){grid[r][c]=r>=gap?col[r-gap]:-1;}
  }
}
function procM(){
  let total=0,iter=0;
  do{
    const m=rmM();
    if(!m.length)break;
    total+=m.length;
    m.forEach(v=>{if(!hates.some(h=>h.c===v.c&&h.r===v.r))spawnP(GX+v.c*TILE+TILE/2,GY+v.r*TILE+TILE/2,TILES[v.id].color,6);});
    m.forEach(v=>grid[v.r][v.c]=-1);
    grav();refG();iter++;
  }while(iter<5);
  return total;
}

// ── particles ───────────────────────────────────────────
function spawnP(x,y,color,count=8){
  for(let i=0;i<count;i++)parts.push({x,y,vx:rf(-4,4),vy:rf(-7,-1),life:1,decay:rf(.02,.05),size:rf(4,10),color,sh:Math.random()>.5?0:1});
}
function updateP(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=p.decay;
    if(p.life<=0)parts.splice(i,1);
  }
}
function drawP(){
  parts.forEach(p=>{
    X.globalAlpha=p.life;X.fillStyle=p.color;
    if(p.sh)star(p.x,p.y,5,p.size,p.size*.5);
    else{X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill();}
  });X.globalAlpha=1;
}

// ── draw bg ─────────────────────────────────────────────
function drawBG(){
  bgP+=.005;waterP+=.03;
  const sky=X.createLinearGradient(0,0,0,GY+GRID*TILE+40);
  sky.addColorStop(0,$('#1a1a2e','#1a2e1a',unity));
  sky.addColorStop(1,$('#2d2d4a','#4a2d1a',unity));
  X.fillStyle=sky;X.fillRect(0,0,W,GY+GRID*TILE+40);
  X.fillStyle='#2d8f4e';X.globalAlpha=.6;X.fillRect(0,GY+GRID*TILE+10,GX-10,50);X.globalAlpha=1;
  X.fillStyle='#FF8C00';X.globalAlpha=.6;X.fillRect(GX+GRID*TILE+10,GY+GRID*TILE+10,W-GX-GRID*TILE-10,50);X.globalAlpha=1;
  const bY=GY+GRID*TILE+20,bW=GRID*TILE,segW=bW/5;
  X.fillStyle='rgba(100,150,255,0.3)';
  for(let x=GX;x<GX+bW;x+=20)X.fillRect(x,bY+10+Math.sin(waterP+x*.05)*4,18,6);
  for(let i=0;i<5;i++){
    const built=i<bridge;
    X.fillStyle=built?'#FECA57':'#333';
    X.fillRect(GX+i*segW+2,bY+2,segW-4,16);
    if(built){X.strokeStyle='#fff';X.lineWidth=1;X.strokeRect(GX+i*segW+2,bY+2,segW-4,16);}
  }
  if(bridge>0){X.shadowColor='#FECA57';X.shadowBlur=15*unity;X.fillStyle='rgba(254,202,87,0.1)';X.fillRect(GX,bY,bW,20);X.shadowBlur=0;}
}

// ── draw grid ───────────────────────────────────────────
function drawGrid(){
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const x=GX+c*TILE,y=GY+r*TILE,id=grid[r][c];
    const isS=sel&&sel.c===c&&sel.r===r;
    X.fillStyle='#1a2030';X.fillRect(x+2,y+2,TILE-4,TILE-4);
    if(isS){X.strokeStyle='#FECA57';X.lineWidth=3;X.shadowColor='#FECA57';X.shadowBlur=10;X.strokeRect(x+2,y+2,TILE-4,TILE-4);X.shadowBlur=0;}
    else{X.strokeStyle='#2a3550';X.lineWidth=1;X.strokeRect(x+2,y+2,TILE-4,TILE-4);}
    if(id===-1)continue;
    if(hates.some(h=>h.c===c&&h.r===r)){
      X.fillStyle='#2D2D2D';X.fillRect(x+6,y+6,TILE-12,TILE-12);
      X.fillStyle='#FF4B4B';X.font='bold 10px system-ui';X.textAlign='center';X.textBaseline='middle';
      X.fillText('HATE',x+TILE/2,y+TILE/2-4);X.fillText('❌',x+TILE/2,y+TILE/2+10);continue;
    }
    const t=TILES[id];
    const g=X.createRadialGradient(x+TILE/2,y+TILE/2,2,x+TILE/2,y+TILE/2,TILE/2);
    g.addColorStop(0,t.color);g.addColorStop(1,$c(t.color,'#000',0.3));
    X.fillStyle=g;X.beginPath();X.roundRect(x+5,y+5,TILE-10,TILE-10,6);X.fill();
    X.font='26px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(t.sym,x+TILE/2,y+TILE/2);
  }
}

// ── draw HUD ────────────────────────────────────────────
function drawHUD(){
  X.fillStyle='#fff';X.font='bold 22px system-ui';X.textAlign='left';X.textBaseline='top';
  X.fillText(`Score: ${score}`,20,18);
  X.fillStyle='#aaa';X.font='13px system-ui';X.fillText(`Best: ${hiScore}`,20,44);
  X.textAlign='center';X.font='18px system-ui';
  X.fillText('Lives: '+'❤️'.repeat(lives),W/2,22);
  X.textAlign='right';X.fillStyle='#fff';X.font='bold 18px system-ui';
  X.fillText(`Level ${lv}`,W-20,18);
  X.fillStyle='#aaa';X.font='13px system-ui';X.fillText(`Bridge: ${bridge}/5`,W-20,40);
  if(S==='playing'){
    const bW=120,bH=8,bX=W/2-bW/2,bY=60;
    X.fillStyle='#333';X.fillRect(bX,bY,bW,bH);
    const pct=cd/15;
    X.fillStyle=pct>.3?'#4CAF50':'#FF4B4B';
    X.fillRect(bX,bY,bW*pct,bH);
    X.fillStyle='#888';X.font='10px system-ui';X.textAlign='center';
    X.fillText('Time',W/2,bY-3);
    X.textAlign='center';X.fillStyle='#aaa';X.font='11px system-ui';
    X.fillText(`Matches: ${mThis}/${bNeed}`,W/2,bY+12);
  }
  const mx=20,my=H-30,mw=120,mh=10;
  X.fillStyle='#222';X.fillRect(mx,my,mw,mh);
  X.fillStyle=$c('#8B0000','#4CAF50',unity);X.shadowColor=X.fillStyle;X.shadowBlur=6;
  X.fillRect(mx,my,mw*unity,mh);X.shadowBlur=0;
  X.fillStyle='#aaa';X.font='10px system-ui';X.textAlign='left';X.fillText('❤ Unity',mx,my-4);
  if(factT>0){
    const a=Math.min(1,factT/30);
    X.globalAlpha=a;X.fillStyle='rgba(0,0,0,.75)';X.fillRect(W/2-220,H/2-40,440,65);
    X.fillStyle='#FECA57';X.font='bold 14px system-ui';X.textAlign='center';
    X.fillText(fact,W/2,H/2-8);
    X.fillStyle='#aaa';X.font='11px system-ui';X.fillText('Love builds bridges!',W/2,H/2+18);X.globalAlpha=1;
  }
  if(flash>0){X.fillStyle=`rgba(254,202,87,${flash/25})`;X.fillRect(0,0,W,H);flash--;}
}

// ── draw start ─────────────────────────────────────────
function drawStart(){
  const sky=X.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1a2e');sky.addColorStop(1,'#2d2d4a');
  X.fillStyle=sky;X.fillRect(0,0,W,H);
  X.fillStyle='rgba(100,150,255,0.2)';
  for(let x=0;x<W;x+=20)X.fillRect(x,280+Math.sin(waterP+x*.03)*5,18,5);
  X.fillStyle='#2d8f4e';X.globalAlpha=.5;X.fillRect(0,290,250,H-290);
  X.fillStyle='#FF8C00';X.fillRect(W-250,290,250,H-290);X.globalAlpha=1;
  X.shadowColor='#FECA57';X.shadowBlur=25;
  X.fillStyle='#fff';X.font='bold 46px system-ui';X.textAlign='center';
  X.fillText('Bridge Builder',W/2,80);X.shadowBlur=0;
  X.fillStyle='#FECA57';X.font='bold 20px system-ui';
  X.fillText('🌉 Connect Two Nations 🌉',W/2,130);
  X.fillStyle='#aaa';X.font='15px system-ui';
  X.fillText('Match 3+ tiles to build the bridge',W/2,170);
  X.fillText('Tap two adjacent tiles to swap',W/2,192);
  X.fillText('Fill the Unity meter to win!',W/2,214);
  const pY=270;
  TILES.forEach((t,i)=>{
    const px=W/2-3*TILE/2+i*TILE;
    const g=X.createRadialGradient(px,pY,2,px,pY,TILE/2);
    g.addColorStop(0,t.color);g.addColorStop(1,$c(t.color,'#000',0.3));
    X.fillStyle=g;X.beginPath();X.roundRect(px-22,pY-22,44,44,6);X.fill();
    X.font='22px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(t.sym,px,pY);
  });
  const a=.7+Math.sin(fc*.08)*.3;
  X.globalAlpha=a;X.fillStyle='#fff';X.font='bold 18px system-ui';
  X.fillText('TAP TO START',W/2,430);X.globalAlpha=1;
  X.fillStyle='#555';X.font='12px system-ui';
  X.fillText('IndoPak.love — Building bridges through games',W/2,H-20);
}

// ── draw gameover ───────────────────────────────────────
function drawOver(){
  X.fillStyle='rgba(0,0,0,.8)';X.fillRect(0,0,W,H);
  X.fillStyle='#FF4B4B';X.font='bold 44px system-ui';X.textAlign='center';
  X.fillText('Game Over',W/2,H/2-60);
  X.fillStyle='#fff';X.font='22px system-ui';X.fillText(`Score: ${score}`,W/2,H/2-5);
  X.fillStyle='#aaa';X.font='16px system-ui';X.fillText(gameOverR||'The hate won this time.',W/2,H/2+25);
  if(score>hiScore){X.fillStyle='#FECA57';X.font='bold 18px system-ui';X.fillText('🏆 New Best! 🏆',W/2,H/2+60);}
  const a=.7+Math.sin(fc*.1)*.3;X.globalAlpha=a;X.fillStyle='#fff';X.font='bold 17px system-ui';
  X.fillText('TAP TO PLAY AGAIN',W/2,H/2+100);X.globalAlpha=1;
}

// ── draw win ─────────────────────────────────────────────
function drawWin(){
  X.fillStyle='rgba(0,0,0,.8)';X.fillRect(0,0,W,H);
  X.shadowColor='#4CAF50';X.shadowBlur=30;
  X.fillStyle='#4CAF50';X.font='bold 44px system-ui';X.textAlign='center';
  X.fillText('🎉 Bridge Complete! 🎉',W/2,H/2-70);X.shadowBlur=0;
  X.fillStyle='#FECA57';X.font='bold 22px system-ui';
  X.fillText('Love Built The Bridge!',W/2,H/2-15);
  X.fillStyle='#fff';X.font='20px system-ui';
  X.fillText(`Score: ${score}  |  Level: ${lv}`,W/2,H/2+25);
  const a=.7+Math.sin(fc*.1)*.3;X.globalAlpha=a;X.fillStyle='#fff';X.font='bold 17px system-ui';
  X.fillText(lv<5?'TAP FOR NEXT LEVEL':'TAP TO PLAY AGAIN',W/2,H/2+75);X.globalAlpha=1;
}

// ── hate blocks ─────────────────────────────────────────
function spawnHate(){
  let c,r,att=0;
  do{c=ri(0,GRID-1);r=ri(0,GRID-1);att++;}while((grid[r][c]===-1||hates.some(h=>h.c===c&&h.r===r))&&att<20);
  if(att<20){hates.push({c,r,life:600});sfxH();spawnP(GX+c*TILE+TILE/2,GY+r*TILE+TILE/2,'#FF4B4B',8);}
}
function updateHates(){
  hateT++;
  const rate=Math.max(300,500-lv*30);
  if(hateT>=rate&&hates.length<3){spawnHate();hateT=0;}
  hates=hates.filter(h=>{h.life--;return h.life>0;});
}

// ── input ───────────────────────────────────────────────
C.onpointerdown=e=>{
  initAC();
  const rect=C.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/parseFloat(C.style.width));
  const y=(e.clientY-rect.top)*(H/parseFloat(C.style.height));
  if(S==='start'){resetG();S='playing';cd=15;lastTick=Date.now();return;}
  if(S==='gameover'||S==='win'){resetG();S='playing';cd=15;lastTick=Date.now();return;}
  if(S!=='playing')return;
  const c=Math.floor((x-GX)/TILE),r=Math.floor((y-GY)/TILE);
  if(c<0||c>=GRID||r<0||r>=GRID)return;
  if(hates.some(h=>h.c===c&&h.r===r))return;
  sfxS();
  if(!sel){sel={c,r};return;}
  const dc=Math.abs(sel.c-c),dr=Math.abs(sel.r-r);
  if((dc===1&&dr===0)||(dc===0&&dr===1)){
    swap(sel.c,sel.r,c,r);sel=null;
  } else {sel={c,r};}
};
function swap(c1,r1,c2,r2){
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  const m=rmM();
  if(m.length>0){
    combo++;
    const pts=m.length*10+(m.length>=5?50:0)+(combo>2?(combo-2)*5:0);
    score+=pts;unity=Math.min(1,score/500);
    procM();sfxM();
    if(m.length>=5){sfxB();fact=FACTS[ri(0,FACTS.length-1)];factT=120;flash=15;}
    mThis++;
    if(mThis>=bNeed){bridge=Math.min(5,bridge+1);mThis=0;bNeed=5+lv*2;sfxL();fact='Bridge segment complete! 🌉';factT=150;if(bridge>=5){S='win';return;}}
    cd=15;lastTick=Date.now();
  } else {
    [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    combo=0;lives--;sfxMiss();
    if(lives<=0){S='gameover';gameOverR='No more moves!';}
  }
}
function resetG(){
  lv=1;score=0;lives=3;bridge=0;mThis=0;bNeed=5;
  hates=[];hateT=0;combo=0;parts=[];unity=0;
  fact='';factT=0;cd=15;lastTick=Date.now();sel=null;
  initG();
}

// ── main loop ───────────────────────────────────────────
function loop(){
  fc++;
  X.clearRect(0,0,W,H);
  if(S==='start'){drawStart();setInterval(loop, 16);return;}
  if(S==='playing'){
    const now=Date.now();
    if(now-lastTick>=1000){cd--;lastTick=now;if(cd<=0){cd=15;lives--;sfxMiss();if(lives<=0){S='gameover';}}}
    updateHates();updateP();
  }
  drawBG();
  if(S!=='start')drawGrid();
  drawP();
  if(S==='playing'||S==='gameover'||S==='win')drawHUD();
  if(S==='gameover')drawOver();
  if(S==='win')drawWin();
  setInterval(loop, 16);
}

initG();
for(let i=0;i<3;i++)spawnP(Math.random()*W,Math.random()*H*.5,'#FECA57',5);
loop();
</script>
</body>
</html>
