<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bridge Builder — IndoPak.love</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; font-family:system-ui,sans-serif; }
#gameCanvas { display:block; border-radius:12px; box-shadow:0 0 60px rgba(45,143,78,0.3); cursor:pointer; touch-action:none; }
#loading { position:fixed; top:0;left:0;right:0;bottom:0; background:#0d1117; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#f0f0f0; font-size:18px; z-index:100; transition:opacity 0.5s; }
#loading .bridge { font-size:52px; animation:float 1.5s ease-in-out infinite; margin-bottom:16px; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
</style>
</head>
<body>
<div id="loading"><div class="bridge">🌉</div><div>Building bridges...</div></div>
<canvas id="gameCanvas"></canvas>
<script>
// ═══════════════════════════════════════════════════════
//  Bridge Builder — Connect hearts across borders
//  IndoPak.love
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID = 6, TILE = 64, PAD = 8;
const COLS = GRID, ROWS = GRID;
const GRID_X = (800 - GRID*TILE)/2, GRID_Y = 90;

function resize() {
  const maxW=800, maxH=580, ratio=maxW/maxH;
  let w=window.innerWidth*0.97, h=w/ratio;
  if(h>window.innerHeight*0.95){h=window.innerHeight*0.95; w=h*ratio;}
  canvas.width=maxW; canvas.height=maxH;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
}
resize(); window.addEventListener('resize',resize);

// ── Audio ──────────────────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext);}if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(f,f2,type,dur,vol=0.25){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,audioCtx.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
const sfxMatch=()=>{ tone(660,'sine',0.08,0.2); setTimeout(()=>tone(880,'sine',0.1,0.15),80); };
const sfxBig=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.15,0.2),i*90));};
const sfxHate=()=>tone(80,'sawtooth',0.3,0.35);
const sfxSelect=()=>tone(440,'sine',0.06,0.15);
const sfxLevel=()=>{[262,330,392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.2,0.25),i*120));};
const sfxMiss=()=>tone(150,'sawtooth',0.2,0.2);

// ── Tile Types ─────────────────────────────────────────
const TILES = [
  { id:0, color:'#2d8f4e', symbol:'🇵🇰', label:'PK' },
  { id:1, color:'#FF8C00', symbol:'🇮🇳', label:'IN' },
  { id:2, color:'#FF4B4B', symbol:'❤️',  label:'♥'  },
  { id:3, color:'#FECA57', symbol:'⭐',  label:'★'  },
  { id:4, color:'#c8a2c8', symbol:'☕',  label:'Chai' },
  { id:5, color:'#64b5f6', symbol:'📖',  label:'Book' },
];
const MATCH3 = 3, MATCH5 = 5;
const BRIDGE_LEVELS = [5,7,9,11,13]; // matches needed per level

// ── Game State ─────────────────────────────────────────
let state='loading';
let grid=[], selected=null, score=0, lives=3, level=1;
let matchesThisBridge=0, bridgeGoal=5;
let hateBlocks=[], hateTimer=0, comboTimer=0;
let comboCount=0, animTiles=[], particleBurst=[];
let unityLevel=0, unityFacts=['Chai unites us all ☕','Cricket bridges nations 🏏','Faiz Ahmed Faiz: loved across borders ✍️','Taj Mahal & Badshahi Mosque — both built with love 🕌','Qawwali echoes in both lands 🎵','Bollywood & Lollywood shaped our dreams 🎬'];
let factText='', factTimer=0, flashTimer=0;
let frameCount=0, lastTick=0, countdown=0;
let bgPhase=0, waterWave=0;
let bridgeSegments=0; // 0-5, visual bridge progress
let gameOverReason='';
let highScore=parseInt(localStorage.getItem('bb_hs')||'0');

// ── Grid Helpers ────────────────────────────────────────
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function randTile(){return Math.floor(Math.random()*TILES.length);}
function cellXY(c,r){return{x:GRID_X+c*TILE,y:GRID_Y+r*TILE};}
function tileAt(x,y){
  const c=Math.floor((x-GRID_X)/TILE), r=Math.floor((y-GRID_Y)/TILE);
  if(c<0||c>=GRID||r<0||r>=ROWS)return null;
  return {c,r,grid:grid[r][c]};
}
function isHateBlock(c,r){return hateBlocks.some(h=>h.c===c&&h.r===r);}

// ── Grid Init ───────────────────────────────────────────
function initGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      let id;
      do{id=randTile();}while(
        (c>=2 && grid[r][c-1]===id && grid[r][c-2]===id) ||
        (r>=2 && grid[r-1][c]===id && grid[r-2][c]===id)
      );
      grid[r][c]=id;
    }
  }
}
function refillGrid(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]===-1){
      let id;
      do{id=randTile();}while(
        (c>=2 && grid[r][c-1]===id && grid[r][c-2]===id) ||
        (r>=2 && grid[r-1][c]===id && grid[r-2][c]===id)
      );
      grid[r][c]=id;
    }
  }
}
function removeMatches(){
  let matched=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(isHateBlock(c,r))continue;
    const id=grid[r][c];
    // Horizontal
    let len=1; while(c+len<COLS&&!isHateBlock(c+len,r)&&grid[r][c+len]===id)len++;
    if(len>=MATCH3)for(let i=0;i<len;i++)matched.push({c:c+i, r:r+i, id:id});
    // Vertical
    len=1; while(r+len<ROWS&&!isHateBlock(c,r+len)&&grid[r+len][c]===id)len++;
    if(len>=MATCH3)for(let i=0;i<len;i++)if(!matched.some(m=>m.c===c&&m.r===r+i))matched.push({c:c, r:r+i, id:id});
  }
  // Remove duplicates
  let unique=[]; let seen={};
  matched.forEach(m=>{const k=`${m.c},${m.r}`;if(!seen[k]){seen[k]=1;unique.push(m);}});
  return unique;
}
function applyGravity(){
  for(let c=0;c<COLS;c++){
    let col=[];
    for(let r=ROWS-1;r>=0;r--){
      if(!isHateBlock(c,r)&&grid[r][c]!==-1)col.push(grid[r][c]);
    }
    const gap=ROWS-col.length;
    for(let r=ROWS-1;r>=0;r--){
      if(r>=gap)grid[r][c]=col[r-gap];
      else grid[r][c]=-1;
    }
  }
}
function processMatches(){
  let totalMatched=0;
  let iteration=0;
  do{
    const matched=removeMatches();
    if(matched.length===0)break;
    totalMatched+=matched.length;
    matched.forEach(m=>{
      if(!isHateBlock(m.c,m.r)){
        spawnParticles(GRID_X+m.c*TILE+TILE/2, GRID_Y+m.r*TILE+TILE/2, TILES[m.id].color, 6);
      }
    });
    matched.forEach(m=>grid[m.r][m.c]=-1);
    applyGravity();
    refillGrid();
    iteration++;
  }while(iteration<5);
  return totalMatched;
}

// ── Particles ────────────────────────────────────────────
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particleBurst.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.8)*7,life:1,decay:0.03+Math.random()*0.03,size:4+Math.random()*6,color,shape:Math.random()>0.5?'circle':'square'});
  }
}
function updateParticles(){
  for(let i=particleBurst.length-1;i>=0;i--){
    const p=particleBurst[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=p.decay;
    if(p.life<=0)particleBurst.splice(i,1);
  }
}
function drawParticles(){
  particleBurst.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    if(p.shape==='circle'){ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    else{ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  });
  ctx.globalAlpha=1;
}

// ── Input ───────────────────────────────────────────────
let pointerDown=null;
canvas.addEventListener('pointerdown',e=>{
  initAudio();
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/parseFloat(canvas.style.width));
  const y=(e.clientY-rect.top)*(canvas.height/parseFloat(canvas.style.height));
  if(state==='start'){state='playing'; countdown=15; lastTick=Date.now(); return;}
  if(state==='gameover'||state==='win'){resetGame(); return;}
  if(state!=='playing')return;
  const t=tileAt(x,y);
  if(!t||isHateBlock(t.c,t.r))return;
  sfxSelect();
  if(!selected){selected={c:t.c,r:t.r};return;}
  const dc=Math.abs(selected.c-t.c), dr=Math.abs(selected.r-t.r);
  if((dc===1&&dr===0)||(dc===0&&dr===1)){
    swapTiles(selected.c,selected.r,t.c,t.r);
    selected=null;
  } else { selected={c:t.c,r:t.r}; }
});
canvas.addEventListener('pointerup',()=>{});

function swapTiles(c1,r1,c2,r2){
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  const matched=removeMatches();
  if(matched.length>0){
    comboCount++;
    const pts=matched.length*10+(matched.length>=5?50:0)+(comboCount>2?(comboCount-2)*5:0);
    score+=pts;
    unityLevel=Math.min(1,score/500);
    processMatches();
    sfxMatch();
    if(matched.length>=5){sfxBig(); factText=unityFacts[Math.floor(Math.random()*unityFacts.length)]; factTimer=120; flashTimer=15; }
    matchesThisBridge++;
    if(matchesThisBridge>=bridgeGoal){ bridgeSegments=Math.min(5,bridgeSegments+1); matchesThisBridge=0; bridgeGoal=BRIDGE_LEVELS[Math.min(level-1,BRIDGE_LEVELS.length-1)]; sfxLevel(); factText='Bridge segment complete! 🌉'; factTimer=150; if(bridgeSegments>=5){ state='win'; return; } }
    countdown=15; lastTick=Date.now();
  } else {
    [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    comboCount=0; lives--; sfxMiss();
    if(lives<=0){state='gameover';gameOverReason='No more moves!';}
  }
}

// ── Hate Block Spawn ─────────────────────────────────────
function spawnHateBlock(){
  let c,r,attempts=0;
  do{c=Math.floor(Math.random()*COLS);r=Math.floor(Math.random()*ROWS);attempts++;}while((grid[r][c]===-1||isHateBlock(c,r))&&attempts<20);
  if(attempts<20){ hateBlocks.push({c,r,life:600}); sfxHate(); spawnParticles(GRID_X+c*TILE+TILE/2,GRID_Y+r*TILE+TILE/2,'#FF4B4B',8); }
}
function updateHateBlocks(){
  hateTimer++;
  const spawnRate=Math.max(300,500-level*30);
  if(hateTimer>=spawnRate&&hateBlocks.length<3){spawnHateBlock(); hateTimer=0;}
  for(let i=hateBlocks.length-1;i>=0;i--){
    hateBlocks[i].life--;
    if(hateBlocks[i].life<=0){
      hateBlocks.splice(i,1);
      const {c,r}=hateBlocks[i]||{c:-1,r:-1};
    }
  }
}

// ── Reset / Start ────────────────────────────────────────
function resetGame(){
  level=1; score=0; lives=3; bridgeSegments=0; matchesThisBridge=0; bridgeGoal=5;
  hateBlocks=[]; hateTimer=0; comboCount=0; particleBurst=[]; unityLevel=0;
  factText=''; factTimer=0; countdown=15; lastTick=Date.now(); selected=null;
  initGrid();
  state='playing';
}
function nextLevel(){
  level++; bridgeSegments=0; matchesThisBridge=0; bridgeGoal=BRIDGE_LEVELS[Math.min(level-1,BRIDGE_LEVELS.length-1)];
  hateBlocks=[]; hateTimer=0; countdown=15; lastTick=Date.now(); state='playing';
}

// ── Draw Functions ────────────────────────────────────────
function drawBackground(){
  bgPhase+=0.005; waterWave+=0.03;
  // Sky
  const skyG=ctx.createLinearGradient(0,0,0,GRID_Y+ROWS*TILE+40);
  skyG.addColorStop(0, lerp('#1a1a2e','#1a2e1a',unityLevel));
  skyG.addColorStop(1, lerp('#2d2d4a','#4a2d1a',unityLevel));
  ctx.fillStyle=skyG; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Left village (PK)
  ctx.globalAlpha=0.6;
  ctx.fillStyle='#2d8f4e';
  ctx.fillRect(0,GRID_Y+ROWS*TILE+10,GRID_X-10,50);
  // Right village (IN)
  ctx.fillStyle='#FF8C00';
  ctx.fillRect(GRID_X+GRID*TILE+10,GRID_Y+ROWS*TILE+10,canvas.width-GRID_X-GRID*TILE-10,50);
  ctx.globalAlpha=1;
  
  // Bridge area
  const bridgeY=GRID_Y+ROWS*TILE+20;
  const bridgeW=GRID*TILE;
  // Water
  ctx.fillStyle='rgba(100,150,255,0.3)';
  for(let x=GRID_X;x<GRID_X+bridgeW;x+=20){
    const wy=bridgeY+10+Math.sin(waterWave+x*0.05)*4;
    ctx.fillRect(x,wy,18,6);
  }
  // Bridge segments
  const segW=bridgeW/5;
  for(let i=0;i<5;i++){
    const built=i<bridgeSegments;
    ctx.fillStyle=built?'#FECA57':'#333';
    ctx.fillRect(GRID_X+i*segW+2, bridgeY+2, segW-4, 16);
    if(built){
      ctx.strokeStyle='#fff'; ctx.lineWidth=1;
      ctx.strokeRect(GRID_X+i*segW+2, bridgeY+2, segW-4, 16);
    }
  }
  // Bridge glow
  if(bridgeSegments>0){
    ctx.shadowColor='#FECA57'; ctx.shadowBlur=15*unityLevel;
    ctx.fillStyle='rgba(254,202,87,0.1)';
    ctx.fillRect(GRID_X, bridgeY, bridgeW, 20);
    ctx.shadowBlur=0;
  }
}
function lerp(a,b,t){return a+(b-a)*t;}
function lerpColor(a,b,t){
  const parse=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const [ar,ag,ab]=parse(a),[br,bg,bb]=parse(b);
  return`rgb(${Math.round(lerp(ar,br,t))},${Math.round(lerp(ag,bg,t))},${Math.round(lerp(ab,bb,t))})`;
}

function drawGrid(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const {x,y}=cellXY(c,r);
      const id=grid[r][c];
      const isSelected=selected&&selected.c===c&&selected.r===r;
      
      // Cell bg
      ctx.fillStyle='#1a2030';
      ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
      
      // Border glow
      if(isSelected){
        ctx.strokeStyle='#FECA57'; ctx.lineWidth=3;
        ctx.shadowColor='#FECA57'; ctx.shadowBlur=10;
        ctx.strokeRect(x+2,y+2,TILE-4,TILE-4);
        ctx.shadowBlur=0;
      } else {
        ctx.strokeStyle='#2a3550'; ctx.lineWidth=1;
        ctx.strokeRect(x+2,y+2,TILE-4,TILE-4);
      }
      
      if(id===-1)continue;
      if(isHateBlock(c,r)){
        ctx.fillStyle='#2D2D2D';
        ctx.fillRect(x+6,y+6,TILE-12,TILE-12);
        ctx.fillStyle='#FF4B4B'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('HATE',x+TILE/2,y+TILE/2-4);
        ctx.fillText('❌',x+TILE/2,y+TILE/2+10);
        continue;
      }
      
      const tile=TILES[id];
      // Tile color bg
      const gradient=ctx.createRadialGradient(x+TILE/2,y+TILE/2,2,x+TILE/2,y+TILE/2,TILE/2);
      gradient.addColorStop(0,tile.color);
      gradient.addColorStop(1,lerpColor(tile.color,'#000',0.3));
      ctx.fillStyle=gradient;
      ctx.beginPath(); ctx.roundRect(x+5,y+5,TILE-10,TILE-10,6); ctx.fill();
      
      // Symbol
      ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(tile.symbol,x+TILE/2,y+TILE/2);
    }
  }
}

function drawHUD(){
  // Score
  ctx.fillStyle='#fff'; ctx.font='bold 22px system-ui'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`Score: ${score}`,20,18);
  ctx.fillStyle='#aaa'; ctx.font='13px system-ui';
  ctx.fillText(`Best: ${highScore}`,20,44);
  
  // Lives
  ctx.textAlign='center'; ctx.font='18px system-ui';
  ctx.fillText('Lives: '+'❤️'.repeat(lives),canvas.width/2,22);
  
  // Level + Bridge
  ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 18px system-ui';
  ctx.fillText(`Level ${level}`,canvas.width-20,18);
  ctx.fillStyle='#aaa'; ctx.font='13px system-ui';
  ctx.fillText(`Bridge: ${bridgeSegments}/5`,canvas.width-20,40);
  
  // Countdown bar
  if(state==='playing'){
    const barW=120, barH=8, barX=canvas.width/2-barW/2, barY=60;
    ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barW,barH);
    const pct=countdown/15;
    ctx.fillStyle=pct>0.3?'#4CAF50':'#FF4B4B';
    ctx.fillRect(barX,barY,barW*pct,barH);
    ctx.fillStyle='#888'; ctx.font='10px system-ui'; ctx.textAlign='center';
    ctx.fillText('Time',canvas.width/2,barY-3);
  }
  
  // Unity meter
  const mx=20, my=canvas.height-30, mw=120, mh=10;
  ctx.fillStyle='#222'; ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle=lerpColor('#8B0000','#4CAF50',unityLevel);
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=6;
  ctx.fillRect(mx,my,mw*unityLevel,mh); ctx.shadowBlur=0;
  ctx.fillStyle='#aaa'; ctx.font='10px system-ui'; ctx.textAlign='left';
  ctx.fillText('❤ Unity',mx,my-4);
  
  // Match progress
  ctx.textAlign='center'; ctx.fillStyle='#aaa'; ctx.font='11px system-ui';
  ctx.fillText(`Matches: ${matchesThisBridge}/${bridgeGoal}`,canvas.width/2,barY+12);
  
  // Fact flash
  if(factTimer>0){
    const alpha=Math.min(1,factTimer/30);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(canvas.width/2-220,canvas.height/2-40,440,65);
    ctx.fillStyle='#FECA57'; ctx.font='bold 14px system-ui'; ctx.textAlign='center';
    ctx.fillText(factText,canvas.width/2,canvas.height/2-8);
    ctx.fillStyle='#aaa'; ctx.font='11px system-ui';
    ctx.fillText('Love builds bridges!',canvas.width/2,canvas.height/2+18);
    ctx.globalAlpha=1;
  }
  
  // Flash
  if(flashTimer>0){
    ctx.fillStyle=`rgba(254,202,87,${flashTimer/25})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    flashTimer--;
  }
}

function drawStartScreen(){
  bgPhase+=0.005;
  const skyG=ctx.createLinearGradient(0,0,0,canvas.height);
  skyG.addColorStop(0,'#1a1a2e'); skyG.addColorStop(1,'#2d2d4a');
  ctx.fillStyle=skyG; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Water
  waterWave+=0.02;
  ctx.fillStyle='rgba(100,150,255,0.2)';
  for(let x=0;x<canvas.width;x+=20){
    ctx.fillRect(x,280+Math.sin(waterWave+x*0.03)*5,18,5);
  }
  
  // Village sides
  ctx.fillStyle='#2d8f4e'; ctx.globalAlpha=0.5; ctx.fillRect(0,290,250,canvas.height-290);
  ctx.fillStyle='#FF8C00'; ctx.fillRect(canvas.width-250,290,250,canvas.height-290); ctx.globalAlpha=1;
  
  ctx.shadowColor='#FECA57'; ctx.shadowBlur=25;
  ctx.fillStyle='#fff'; ctx.font='bold 46px system-ui'; ctx.textAlign='center';
  ctx.fillText('Bridge Builder',canvas.width/2,80);
  ctx.shadowBlur=0;
  
  ctx.fillStyle='#FECA57'; ctx.font='bold 20px system-ui';
  ctx.fillText('🌉 Connect Two Nations 🌉',canvas.width/2,130);
  
  ctx.fillStyle='#aaa'; ctx.font='15px system-ui';
  ctx.fillText('Match 3+ tiles to build the bridge',canvas.width/2,170);
  ctx.fillText('Tap two adjacent tiles to swap',canvas.width/2,192);
  ctx.fillText('Fill the Unity meter to win!',canvas.width/2,214);
  
  // Preview tiles
  const previewY=270;
  TILES.forEach((t,i)=>{
    const px=canvas.width/2-3*TILE/2+i*TILE;
    const gradient=ctx.createRadialGradient(px+t.symbol.length*0,previewY,2,px,previewY,TILE/2);
    gradient.addColorStop(0,t.color); gradient.addColorStop(1,lerpColor(t.color,'#000',0.3));
    ctx.fillStyle=gradient;
    ctx.beginPath(); ctx.roundRect(px-22,previewY-22,44,44,6); ctx.fill();
    ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.symbol,px,previewY);
  });
  
  const pulse=0.7+Math.sin(frameCount*0.08)*0.3;
  ctx.globalAlpha=pulse; ctx.fillStyle='#fff'; ctx.font='bold 18px system-ui';
  ctx.fillText('TAP TO START',canvas.width/2,430); ctx.globalAlpha=1;
  
  ctx.fillStyle='#555'; ctx.font='12px system-ui';
  ctx.fillText('IndoPak.love — Building bridges through games',canvas.width/2,canvas.height-20);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#FF4B4B'; ctx.font='bold 44px system-ui'; ctx.textAlign='center';
  ctx.fillText('Game Over',canvas.width/2,canvas.height/2-60);
  ctx.fillStyle='#fff'; ctx.font='22px system-ui';
  ctx.fillText(`Score: ${score}`,canvas.width/2,canvas.height/2-5);
  ctx.fillStyle='#aaa'; ctx.font='16px system-ui';
  ctx.fillText(gameOverReason||'The hate won this time.',canvas.width/2,canvas.height/2+25);
  if(score>highScore){ctx.fillStyle='#FECA57';ctx.font='bold 18px system-ui';ctx.fillText('🏆 New Best! 🏆',canvas.width/2,canvas.height/2+60);}
  const p=0.7+Math.sin(frameCount*0.1)*0.3; ctx.globalAlpha=p; ctx.fillStyle='#fff'; ctx.font='bold 17px system-ui';
  ctx.fillText('TAP TO PLAY AGAIN',canvas.width/2,canvas.height/2+100); ctx.globalAlpha=1;
}

function drawWin(){
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.shadowColor='#4CAF50'; ctx.shadowBlur=30;
  ctx.fillStyle='#4CAF50'; ctx.font='bold 44px system-ui'; ctx.textAlign='center';
  ctx.fillText('🎉 Bridge Complete! 🎉',canvas.width/2,canvas.height/2-70);
  ctx.shadowBlur=0;
  ctx.fillStyle='#FECA57'; ctx.font='bold 22px system-ui';
  ctx.fillText('Love Built The Bridge!',canvas.width/2,canvas.height/2-15);
  ctx.fillStyle='#fff'; ctx.font='20px system-ui';
  ctx.fillText(`Score: ${score}  |  Level: ${level}`,canvas.width/2,canvas.height/2+25);
  if(score>highScore){highScore=score;localStorage.setItem('bb_hs',highScore);}
  const p=0.7+Math.sin(frameCount*0.1)*0.3; ctx.globalAlpha=p; ctx.fillStyle='#fff'; ctx.font='bold 17px system-ui';
  ctx.fillText(level<5?'TAP FOR NEXT LEVEL':'TAP TO PLAY AGAIN',canvas.width/2,canvas.height/2+75); ctx.globalAlpha=1;
}

// ── Main Loop ─────────────────────────────────────────────
function gameLoop(){
  frameCount++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  if(state==='loading'){
    document.getElementById('loading').style.opacity='0';
    setTimeout(()=>{document.getElementById('loading').style.display='none';},500);
    state='start'; return;
  }
  
  if(state==='start'){drawStartScreen();requestAnimationFrame(gameLoop);return;}
  
  if(state==='playing'){
    // Countdown
    const now=Date.now();
    if(now-lastTick>=1000){countdown--;lastTick=now;if(countdown<=0){countdown=15;lives--;sfxMiss();if(lives<=0){state='gameover';}}}
    updateHateBlocks(); updateParticles();
  }
  
  drawBackground();
  if(state!=='start'){drawGrid();}
  drawParticles();
  if(state==='playing'||state==='gameover'||state==='win')drawHUD();
  if(state==='gameover')drawGameOver();
  if(state==='win')drawWin();
  
  requestAnimationFrame(gameLoop);
}

// Boot
initGrid();
for(let i=0;i<3;i++)spawnParticles(Math.random()*canvas.width,Math.random()*canvas.height*0.5,'#FECA57',5);
gameLoop();
</script>
