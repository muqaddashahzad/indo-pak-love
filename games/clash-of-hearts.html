<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Clash of Hearts — IndoPak.love</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a14; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; font-family:system-ui,sans-serif; }
#gameCanvas { display:block; border-radius:12px; box-shadow:0 0 60px rgba(139,0,0,0.3); cursor:pointer; touch-action:none; }
#loading { position:fixed; top:0;left:0;right:0;bottom:0; background:#0a0a14; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#f0f0f0; font-size:18px; z-index:100; transition:opacity 0.5s; }
#loading .sword { font-size:52px; animation:shake 0.5s ease-in-out infinite alternate; }
@keyframes shake { from{transform:rotate(-8deg)} to{transform:rotate(8deg)} }
</style>
</head>
<body>
<div id="loading"><div class="sword">⚔️</div><div>Preparing the battle...</div></div>
<canvas id="gameCanvas"></canvas>
<script>
// ═══════════════════════════════════════════════════════
//  Clash of Hearts — Turn-Based RPG
//  IndoPak.love
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW=800, maxH=600, ratio=maxW/maxH;
  let w=window.innerWidth*0.97, h=w/ratio;
  if(h>window.innerHeight*0.95){h=window.innerHeight*0.95; w=h*ratio;}
  canvas.width=maxW; canvas.height=maxH;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
}
resize(); window.addEventListener('resize',resize);

// ── Layout ─────────────────────────────────────────────
const HERO_X=120, ALLY_X=220, ENEMY_X=520, ENEMY2_X=620;
const BATTLE_Y=300;

// ── Audio ──────────────────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext);}if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(f,type='sine',dur=0.2,vol=0.3,f2=null){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,audioCtx.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
const sfxAtk=()=>{[200,150,100].forEach((f,i)=>setTimeout(()=>tone(f,'square',0.08,0.2),i*40));};
const sfxHarmony=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.2,0.3),i*60));};
const sfxHeal=()=>{[440,550,660].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.15,0.2),i*50));};
const sfxHit=()=>tone(300,'sawtooth',0.1,0.3);
const sfxWin=()=>{[262,330,392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.2,0.25),i*80));};
const sfxLose=()=>{[200,180,150,100].forEach((f,i)=>setTimeout(()=>tone(f,'sawtooth',0.3,0.2),i*150));};
const sfxUnity=()=>{[392,494,587,784,988].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.3,0.25),i*70));};

// ── Game State ─────────────────────────────────────────
let state='loading';
let stage=1, turn='player', turnPhase='select'; // select | anim | enemy | end
let animTimer=0, animType=null, animTarget=null, animValue=0;
let animQueue=[];
let frameCount=0;
let battleText='', battleTextTimer=0;
let particles=[], screenFlash=0, screenFlashColor='#fff';
let lastPkMove=false, lastInMove=false; // for harmony tracking
let highScore=parseInt(localStorage.getItem('ch_hs')||'0');
let menuSelected=0;
const MENU_ITEMS=['⚔️ Attack','❤️ Heal','🛡️ Defend','✨ Harmony Strike'];

// ── Characters ─────────────────────────────────────────
const HERO={name:'Ahmed',hp:100,maxHp:100,color:'#2d8f4e',side:'pk',x:HERO_X,y:BATTLE_Y,alive:true,defending:false};
const ALLY={name:'Priya',hp:100,maxHp:100,color:'#FF8C00',side:'in',x:ALLY_X,y:BATTLE_Y,alive:true,defending:false};
let ENEMIES=[];
let STAGE_ENEMIES={
  1:[{name:'Hate Soldier',hp:60,maxHp:60,color:'#8B0000',x:ENEMY_X,y:BATTLE_Y,alive:true,defending:false,type:'hate'}],
  2:[{name:'Grudge Knight',hp:80,maxHp:80,color:'#4B0082',x:ENEMY_X,y:BATTLE_Y,alive:true,defending:false,type:'grudge'}],
  3:[{name:'The Shadow',hp:120,maxHp:120,color:'#1a1a1a',x:ENEMY_X,y:BATTLE_Y,alive:true,defending:false,type:'shadow'}],
  4:[{name:'Division Lord',hp:150,maxHp:150,color:'#2D2D2D',x:ENEMY_X,y:BATTLE_Y,alive:true,defending:false,type:'division'}],
};
const STORY={
  1:{text:"A Hate Soldier blocks your path!",pkMove:false,inMove:false},
  2:{text:"A Grudge Knight appears!",pkMove:false,inMove:false},
  3:{text:"You and Priya realize... you've been fighting each other all along!",pkMove:true,inMove:true},
  4:{text:"The true enemy: Division Lord! Together, you are stronger!",pkMove:true,inMove:true},
};
let unified=false;

function loadStage(s){
  stage=s;
  HERO.hp=HERO.maxHp; HERO.alive=true; HERO.defending=false;
  ALLY.hp=ALLY.maxHp; ALLY.alive=true; ALLY.defending=false;
  lastPkMove=false; lastInMove=false;
  ENEMIES=STAGE_ENEMIES[Math.min(s,4)].map(e=>({...e,hp:e.maxHp,alive:true,defending:false}));
  turn='player'; turnPhase='select'; menuSelected=0;
  battleText=STORY[Math.min(s,4)].text||'Battle!';
  battleTextTimer=120;
  unified=s>=3;
  if(s>=3){sfxUnity();}
}

// ── Particles ────────────────────────────────────────────
function spawnParticles(x,y,color,count=10){
  for(let i=0;i<count;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*12,vy:(Math.random()-1)*10,life:1,decay:0.02+Math.random()*0.02,size:5+Math.random()*8,color,shape:Math.random()>0.5?'circle':'square'});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    if(p.shape==='circle'){ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    else{ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  });
  ctx.globalAlpha=1;
}

// ── Menu Drawing ─────────────────────────────────────────
function drawMenu(){
  const menuW=260, menuH=MENU_ITEMS.length*46+20;
  const mx=canvas.width-menuW-20, my=canvas.height-menuH-20;
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.beginPath(); ctx.roundRect(mx,my,menuW,menuH,10); ctx.fill();
  ctx.strokeStyle='#444'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(mx,my,menuW,menuH,10); ctx.stroke();
  
  // Disable harmony until both moved
  const harmonyEnabled=unified&&lastPkMove!==lastInMove&&(lastPkMove||lastInMove);
  
  MENU_ITEMS.forEach((item,i)=>{
    const iy=my+15+i*46;
    const selected=i===menuSelected&&turnPhase==='select';
    // Grey out harmony if not available
    const disabled=i===3&&!harmonyEnabled;
    if(selected&&!disabled){
      ctx.fillStyle='rgba(255,255,255,0.1)';
      ctx.beginPath(); ctx.roundRect(mx+5,iy-5,menuW-10,42,6); ctx.fill();
      ctx.strokeStyle='#FECA57'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(mx+5,iy-5,menuW-10,42,6); ctx.stroke();
    }
    ctx.fillStyle=disabled?'#444':'#fff';
    ctx.font=selected&&!disabled?'bold 16px system-ui':'15px system-ui';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(item,mx+18,iy+16);
    if(selected&&!disabled){
      ctx.fillStyle='#FECA57'; ctx.font='14px sans-serif';
      ctx.fillText('▶',mx+8,iy+16);
    }
  });
  
  // Harmony hint
  if(!harmonyEnabled&&unified){
    ctx.fillStyle='#888'; ctx.font='11px system-ui'; ctx.textAlign='center';
    ctx.fillText('Use PK Attack + IN Attack first!',mx+menuW/2,my-10);
  }
}

// ── Character Drawing ───────────────────────────────────
function drawChar(c,isPlayer=false){
  if(!c||!c.alive)return;
  const {x,y,color,name,hp,maxHp,defending}=c;
  const bounce=Math.sin(frameCount*0.08)*3;
  
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x,y+40,28,8,0,0,Math.PI*2); ctx.fill();
  
  // Body
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(x-20,y-30+bounce,40,50,8); ctx.fill();
  
  // Inner glow
  ctx.strokeStyle='#ffffff44'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x-20,y-30+bounce,40,50,8); ctx.stroke();
  
  // Face
  ctx.fillStyle='#f5deb3';
  ctx.beginPath(); ctx.arc(x,y-45+bounce,18,0,Math.PI*2); ctx.fill();
  
  // Eyes
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(x-6,y-48+bounce,3,0,Math.PI*2); ctx.arc(x+6,y-48+bounce,3,0,Math.PI*2); ctx.fill();
  
  // Expression based on HP
  ctx.strokeStyle='#333'; ctx.lineWidth=2;
  ctx.beginPath();
  if(c.hp<maxHp*0.3){ctx.arc(x,y-38+bounce,6,Math.PI+0.3,Math.PI*2-0.3);}
  else {ctx.arc(x,y-40+bounce,6,0.3,Math.PI-0.3);}
  ctx.stroke();
  
  // Shield if defending
  if(defending){
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.strokeStyle='#FECA57'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y-5+bounce,35,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  
  // Flag/symbol
  ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(c.side==='pk')ctx.fillText('🇵🇰',x,y-75+bounce);
  else if(c.side==='in')ctx.fillText('🇮🇳',x,y-75+bounce);
  else ctx.fillText('👤',x,y-75+bounce);
  
  // HP bar
  const barW=60, barH=8, barX=x-barW/2, barY=y-88+bounce;
  ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barW,barH);
  const pct=c.hp/c.maxHp;
  ctx.fillStyle=pct>0.5?'#4CAF50':pct>0.25?'#FECA57':'#FF4B4B';
  ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle='#666'; ctx.lineWidth=1; ctx.strokeRect(barX,barY,barW,barH);
  
  // Name
  ctx.fillStyle='#aaa'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(name,barX+barW/2,barY-4);
  
  // Damage/heal number
  if(animTarget===c&&animTimer>0){
    ctx.globalAlpha=animTimer/60;
    ctx.fillStyle=animValue>0?'#FF4B4B':'#4CAF50';
    ctx.font=`bold ${20+animTimer*0.2}px system-ui`; ctx.textAlign='center';
    ctx.fillText(`${animValue>0?'-':'+'}${Math.abs(animValue)}`,x,y-100+bounce+animTimer*0.3);
    ctx.globalAlpha=1;
  }
}

// ── Enemy Drawing ───────────────────────────────────────
function drawEnemy(e){
  if(!e||!e.alive)return;
  const {x,y,color,name,hp,maxHp,type,defending}=e;
  const bounce=Math.sin(frameCount*0.06)*4;
  
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x,y+40,32,10,0,0,Math.PI*2); ctx.fill();
  
  // Body - menacing shape based on type
  ctx.fillStyle=color;
  if(type==='shadow'){
    ctx.globalAlpha=0.7+Math.sin(frameCount*0.1)*0.3;
    ctx.beginPath(); ctx.ellipse(x,y-10+bounce,30,40,0,0,Math.PI*2); ctx.fill();
  } else if(type==='division'){
    // Large armored form
    ctx.beginPath(); ctx.roundRect(x-35,y-50+bounce,70,80,10); ctx.fill();
    ctx.fillStyle='#FF4B4B';
    ctx.fillRect(x-35,y-50+bounce,70,10);
  } else {
    ctx.beginPath(); ctx.roundRect(x-25,y-35+bounce,50,60,8); ctx.fill();
  }
  ctx.globalAlpha=1;
  
  // Eyes - menacing red
  ctx.fillStyle='#FF0000';
  ctx.beginPath(); ctx.arc(x-10,y-15+bounce,5,0,Math.PI*2); ctx.arc(x+10,y-15+bounce,5,0,Math.PI*2); ctx.fill();
  
  // Hate symbol
  if(type==='hate'){
    ctx.strokeStyle='#FF4B4B'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x-10,y-5+bounce); ctx.lineTo(x+10,y+5+bounce);
    ctx.moveTo(x+10,y-5+bounce); ctx.lineTo(x-10,y+5+bounce);
    ctx.stroke();
  }
  
  // Shield
  if(defending){
    ctx.strokeStyle='#8B0000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y-5+bounce,40,0,Math.PI*2); ctx.stroke();
  }
  
  // HP bar
  const barW=70, barH=8, barX=x-barW/2, barY=y-75+bounce;
  ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barW,barH);
  const pct=e.hp/e.maxHp;
  ctx.fillStyle='#FF4B4B'; ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.strokeRect(barX,barY,barW,barH);
  
  ctx.fillStyle='#aaa'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(name,barX+barW/2,barY-4);
  
  if(animTarget===e&&animTimer>0){
    ctx.globalAlpha=animTimer/60;
    ctx.fillStyle='#FF4B4B';
    ctx.font=`bold ${20+animTimer*0.2}px system-ui`; ctx.textAlign='center';
    ctx.fillText(`-${Math.abs(animValue)}`,x,y-85+bounce+animTimer*0.3);
    ctx.globalAlpha=1;
  }
}

// ── Background ──────────────────────────────────────────
function drawBackground(){
  const t=unified?1:0;
  const bg=ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,lerpC('#0a0a14','#0a140a',t));
  bg.addColorStop(1,lerpC('#14102a','#1a0a0a',t));
  ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Ground
  const ground=ctx.createLinearGradient(0,BATTLE_Y+50,0,canvas.height);
  ground.addColorStop(0,lerpC('#1a1a2a','#1a2a1a',t));
  ground.addColorStop(1,lerpC('#2a2a3a','#2a3a2a',t));
  ctx.fillStyle=ground; ctx.fillRect(0,BATTLE_Y+50,canvas.width,canvas.height-BATTLE_Y-50);
  
  // Dividing line
  ctx.strokeStyle=unified?'#FECA5744':'#ffffff11'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(canvas.width/2,200); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
  
  // Side labels
  ctx.fillStyle='#2d8f4e44'; ctx.font='bold 13px system-ui'; ctx.textAlign='center';
  ctx.fillText('🇵🇰 PAKISTAN',canvas.width/4,220);
  ctx.fillStyle='#FF8C0000'; ctx.fillStyle='#FF8C0044';
  ctx.fillText('🇮🇳 INDIA',canvas.width*3/4,220);
  if(unified){
    ctx.fillStyle='#FECA5766';
    ctx.fillText('UNITED!',canvas.width/2,220);
  }
}

// ── HUD ─────────────────────────────────────────────────
function drawHUD(){
  // Stage
  ctx.fillStyle='#aaa'; ctx.font='bold 16px system-ui'; ctx.textAlign='left';
  ctx.fillText(`Stage ${stage}`,20,30);
  
  // Turn indicator
  ctx.textAlign='center';
  ctx.fillStyle=turn==='player'?'#4CAF50':turn==='enemy'?'#FF4B4B':'#FECA57';
  ctx.font='bold 14px system-ui';
  ctx.fillText(turn==='player'?'▶ YOUR TURN':turn==='enemy'?'⚔ ENEMY TURN':'⏳...',canvas.width/2,30);
  
  // Battle text
  if(battleTextTimer>0){
    ctx.globalAlpha=Math.min(1,battleTextTimer/30);
    ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui'; ctx.textAlign='center';
    ctx.fillText(battleText,canvas.width/2,70);
    ctx.globalAlpha=1;
    battleTextTimer--;
  }
  
  // Screen flash
  if(screenFlash>0){
    ctx.fillStyle=`${screenFlashColor}${Math.floor(screenFlash*12).toString(16).padStart(2,'0')}`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    screenFlash--;
  }
}

// ── Start / Win / Lose Screens ────────────────────────────
function drawStartScreen(){
  const t=performance.now()*0.001;
  const bg=ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,'#0a0a14'); bg.addColorStop(1,'#140a1a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Sword clash
  ctx.font='80px sans-serif'; ctx.textAlign='center';
  const swing=Math.sin(t*2)*15;
  ctx.save(); ctx.translate(canvas.width/2-60,200); ctx.rotate((-30+swing)*Math.PI/180); ctx.fillText('⚔️',0,0); ctx.restore();
  ctx.save(); ctx.translate(canvas.width/2+60,200); ctx.rotate((30-swing)*Math.PI/180); ctx.fillText('⚔️',0,0); ctx.restore();
  
  ctx.shadowColor='#FF4B4B'; ctx.shadowBlur=25;
  ctx.fillStyle='#fff'; ctx.font='bold 46px system-ui'; ctx.textAlign='center';
  ctx.fillText('Clash of Hearts',canvas.width/2,320);
  ctx.shadowBlur=0;
  
  ctx.fillStyle='#FECA57'; ctx.font='bold 20px system-ui';
  ctx.fillText('⚔️ Pakistan vs India... or united? ⚔️',canvas.width/2,370);
  
  ctx.fillStyle='#aaa'; ctx.font='14px system-ui';
  ctx.fillText('Ahmed 🇵🇰 and Priya 🇮🇳 stand together',canvas.width/2,415);
  ctx.fillText('But first, they must face their enemies',canvas.width/2,438);
  ctx.fillText('Choose your moves wisely!',canvas.width/2,461);
  
  // Preview chars
  drawChar({x:canvas.width/2-80,y:480,color:'#2d8f4e',side:'pk',hp:100,maxHp:100,alive:true,defending:false});
  drawChar({x:canvas.width/2+80,y:480,color:'#FF8C00',side:'in',hp:100,maxHp:100,alive:true,defending:false});
  
  const pulse=0.7+Math.sin(t*3)*0.3;
  ctx.globalAlpha=pulse; ctx.fillStyle='#fff'; ctx.font='bold 18px system-ui';
  ctx.fillText('TAP TO START BATTLE',canvas.width/2,570); ctx.globalAlpha=1;
  
  ctx.fillStyle='#555'; ctx.font='12px system-ui';
  ctx.fillText('IndoPak.love — Unity is strength',canvas.width/2,canvas.height-15);
}

function drawWinScreen(){
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.shadowColor='#4CAF50'; ctx.shadowBlur=30;
  ctx.fillStyle='#4CAF50'; ctx.font='bold 44px system-ui'; ctx.textAlign='center';
  ctx.fillText('🎉 Stage Complete! 🎉',canvas.width/2,canvas.height/2-60);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='22px system-ui';
  ctx.fillText(`Stage ${stage} cleared!`,canvas.width/2,canvas.height/2);
  if(stage>=4){
    ctx.fillStyle='#FECA57'; ctx.font='bold 26px system-ui';
    ctx.fillText('🏆 Victory! Love won! 🏆',canvas.width/2,canvas.height/2+50);
    ctx.fillStyle='#aaa'; ctx.font='15px system-ui';
    ctx.fillText('The Shadow has been defeated!',canvas.width/2,canvas.height/2+85);
  }
  const p=0.7+Math.sin(performance.now()*0.008)*0.3; ctx.globalAlpha=p; ctx.fillStyle='#fff'; ctx.font='bold 17px system-ui';
  ctx.fillText(stage<4?'TAP FOR NEXT STAGE':'TAP TO PLAY AGAIN',canvas.width/2,canvas.height/2+130); ctx.globalAlpha=1;
}

function drawLoseScreen(){
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.shadowColor='#FF4B4B'; ctx.shadowBlur=25;
  ctx.fillStyle='#FF4B4B'; ctx.font='bold 44px system-ui'; ctx.textAlign='center';
  ctx.fillText('Defeated...',canvas.width/2,canvas.height/2-50);
  ctx.shadowBlur=0;
  ctx.fillStyle='#aaa'; ctx.font='15px system-ui';
  ctx.fillText('Hate won this battle. But the war isn\'t over.',canvas.width/2,canvas.height/2+5);
  ctx.fillStyle='#888'; ctx.font='13px system-ui';
  ctx.fillText('Gather your courage and try again.',canvas.width/2,canvas.height/2+35);
  const p=0.7+Math.sin(performance.now()*0.008)*0.3; ctx.globalAlpha=p; ctx.fillStyle='#fff'; ctx.font='bold 17px system-ui';
  ctx.fillText('TAP TO TRY AGAIN',canvas.width/2,canvas.height/2+80); ctx.globalAlpha=1;
}

function lerpC(a,b,t){
  const p=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const [ar,ag,ab]=p(a),[br,bg,bb]=p(b);
  return`rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

// ── Combat Logic ─────────────────────────────────────────
function queueAnim(type,target,value,duration=60){
  animQueue.push({type,target,value,duration,timer:0});
}
function processAnim(){
  if(animQueue.length===0){turnPhase='select'; animTimer=0; return;}
  const a=animQueue[0];
  a.timer++;
  animType=a.type; animTarget=a.target; animValue=a.value; animTimer=a.duration-a.timer;
  if(a.timer>=a.duration){
    // Apply effect
    if(a.type==='damage'&&a.target){
      const def=a.target.defending?0.8:1;
      a.target.hp=Math.max(0,a.target.hp-Math.round(a.value*def));
      if(a.target.hp<=0){a.target.alive=false; sfxLose();}
      else sfxHit();
    } else if(a.type==='heal'&&a.target){
      a.target.hp=Math.min(a.target.maxHp,a.target.hp+a.value);
      sfxHeal();
    } else if(a.type==='harmony'){
      ENEMIES.forEach(e=>{if(e.alive){e.hp=Math.max(0,e.hp-Math.round(a.value*(e.defending?0.5:1)));if(e.hp<=0)e.alive=false;}});
      sfxHarmony();
      spawnParticles(canvas.width/2,BATTLE_Y-50,'#FECA57',30);
      screenFlash=8; screenFlashColor='#FECA57';
    }
    animQueue.shift();
    if(animQueue.length===0){turnPhase='enemy'; animTimer=0;}
  }
}

function enemyTurn(){
  const aliveEnemies=ENEMIES.filter(e=>e.alive);
  if(aliveEnemies.length===0)return;
  const attacker=aliveEnemies[Math.floor(Math.random()*aliveEnemies.length)];
  const targets=[HERO,ALLY].filter(t=>t.alive);
  if(targets.length===0)return;
  const target=targets[Math.floor(Math.random()*targets.length)];
  const dmg=8+Math.floor(Math.random()*8)+stage*2;
  const def=target.defending?0.5:1;
  target.defending=false;
  sfxAtk();
  spawnParticles(target.x,target.y-20,attacker.color,6);
  queueAnim('damage',target,Math.round(dmg*def));
  animQueue[animQueue.length-1].timer=0;
  turnPhase='anim';
}

function checkBattleEnd(){
  const allEnemiesDead=ENEMIES.every(e=>!e.alive);
  const allPlayersDead=![HERO,ALLY].some(t=>t.alive);
  if(allEnemiesDead){
    if(stage>=4){sfxWin(); state='win';}
    else{state='win';}
    return true;
  }
  if(allPlayersDead){sfxLose(); state='lose'; return true;}
  return false;
}

function doPlayerAction(action){
  if(turnPhase!=='select')return;
  HERO.defending=false; ALLY.defending=false;
  
  if(action===0){ // Attack
    const attacker=Math.random()>0.5?HERO:ALLY;
    const aliveEnemies=ENEMIES.filter(e=>e.alive);
    if(aliveEnemies.length===0)return;
    const target=aliveEnemies[Math.floor(Math.random()*aliveEnemies.length)];
    const dmg=8+Math.floor(Math.random()*8);
    sfxAtk();
    spawnParticles(target.x,target.y-20,attacker.color,8);
    queueAnim('damage',target,dmg);
    if(attacker.side==='pk')lastPkMove=true; else lastInMove=true;
    turnPhase='anim';
  } else if(action===1){ // Heal
    const healer=[HERO,ALLY].find(t=>t.alive&&t.hp<t.maxHp);
    if(healer){
      const heal=15+Math.floor(Math.random()*10);
      sfxHeal();
      spawnParticles(healer.x,healer.y-20,'#4CAF50',10);
      queueAnim('heal',healer,heal);
    }
    turnPhase='anim';
  } else if(action===2){ // Defend
    HERO.defending=true; ALLY.defending=true;
    sfxAtk();
    turnPhase='anim';
  } else if(action===3){ // Harmony Strike
    const enabled=unified&&lastPkMove!==lastInMove&&(lastPkMove||lastInMove);
    if(!enabled)return;
    sfxHarmony();
    queueAnim('harmony',null,20+stage*5);
    turnPhase='anim';
  }
}

// ── Input ───────────────────────────────────────────────
canvas.addEventListener('pointerdown',e=>{
  initAudio();
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/parseFloat(canvas.style.width));
  const y=(e.clientY-rect.top)*(canvas.height/parseFloat(canvas.style.height));
  
  if(state==='loading')return;
  if(state==='start'){state='playing';loadStage(1);return;}
  if(state==='win'){
    if(stage>=4){stage=1;state='start';}
    else{loadStage(stage+1);state='playing';}
    return;
  }
  if(state==='lose'){loadStage(stage);state='playing';return;}
  if(state!=='playing')return;
  
  // Menu
  if(turnPhase==='select'&&x>canvas.width-280){
    const my=canvas.height-220;
    MENU_ITEMS.forEach((_,i)=>{
      const iy=my+15+i*46;
      if(y>=iy-5&&y<=iy+37){
        menuSelected=i;
        doPlayerAction(i);
      }
    });
  }
  
  // Arrow keys for menu navigation
});
document.addEventListener('keydown',e=>{
  initAudio();
  if(state!=='playing'||turnPhase!=='select')return;
  if(e.key==='ArrowUp'){menuSelected=(menuSelected-1+MENU_ITEMS.length)%MENU_ITEMS.length;}
  if(e.key==='ArrowDown'){menuSelected=(menuSelected+1)%MENU_ITEMS.length;}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();doPlayerAction(menuSelected);}
});

// ── Main Loop ─────────────────────────────────────────────
function loop(){
  frameCount++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  if(state==='loading'){
    document.getElementById('loading').style.opacity='0';
    setTimeout(()=>{document.getElementById('loading').style.display='none';},500);
    state='start'; return;
  }
  
  if(state==='start'){drawStartScreen();requestAnimationFrame(loop);return;}
  if(state==='win'){drawBackground();drawWinScreen();requestAnimationFrame(loop);return;}
  if(state==='lose'){drawBackground();drawLoseScreen();requestAnimationFrame(loop);return;}
  
  if(state==='playing'){
    drawBackground();
    
    // Characters
    [HERO,ALLY].forEach(c=>drawChar(c,true));
    ENEMIES.forEach(e=>drawEnemy(e));
    
    drawParticles();
    updateParticles();
    
    // Process animations
    if(turnPhase==='anim'){
      processAnim();
    }
    
    // Enemy turn after animations done
    if(turnPhase==='enemy'&&animQueue.length===0){
      enemyTurn();
    }
    
    // Check end
    if(!checkBattleEnd()&&turnPhase==='select'&&animQueue.length===0){
      drawMenu();
    }
    
    drawHUD();
  }
  
  requestAnimationFrame(loop);
}

loop();
</script>
